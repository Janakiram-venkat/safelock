<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safe Lock 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f4f6; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      .phone {
        position: fixed; left: 16px; bottom: 16px; width: 390px; height: 844px; z-index: 5;
        transform-origin: bottom left; transform: scale(min(1, calc((100vh - 32px) / 868px)));
        border: 12px solid #15171a; border-radius: 52px; overflow: hidden; background: #eceef0;
        box-shadow: 0 0 0 1px #3a3f44, 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      .phone[hidden] { display: none; }
      .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
      @media (max-width: 700px) { .phone { left: 0; bottom: 0; width: 100vw; height: 100vh; border: 0; border-radius: 0; transform: none; } }
      .sensor-label {
        font: 600 11px/1.2 system-ui, sans-serif; color: #fff; background: rgba(17, 24, 39, 0.82);
        padding: 3px 7px; border-radius: 4px; white-space: nowrap; pointer-events: none;
        border-left: 3px solid var(--accent, #22d3ee);
      }

      /* Demo scenarios (src/ui/demoPanel.ts) */
      .demo { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(720px, calc(100vw - 32px)); z-index: 6; --ink: #111827; --muted: #4b5563; --track: #e5e7eb; }
      .demo[hidden], .demo-launch[hidden] { display: none; }
      .demo--beside-phone { left: 422px; transform: none; width: min(560px, calc(100vw - 438px)); }
      @media (max-width: 900px) { .demo--beside-phone { left: 50%; width: calc(100vw - 32px); } }
      .demo-card {
        position: relative; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); color: var(--ink);
        border-radius: 14px; padding: 18px 20px 14px; box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 18px 48px rgba(17, 24, 39, 0.18); overflow: hidden;
      }
      .demo-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--flag); }
      .demo-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .demo-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      .demo-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
      .demo-title { margin: 6px 0 6px; font-size: 20px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
      .demo-text { margin: 0; font-size: 15px; line-height: 1.5; color: #1f2937; }
      .demo-planned { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); padding: 7px 10px; background: #f3f4f6; border-radius: 8px; }
      .demo-planned b { color: var(--ink); font-weight: 600; margin-right: 4px; }
      .demo-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .demo-chip { font-size: 11.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 12%, white); border-radius: 999px; padding: 3px 9px; }
      .demo-bar { display: flex; gap: 4px; margin: 14px 0 10px; }
      .demo-seg { flex: 1; height: 4px; padding: 0; border: 0; border-radius: 2px; cursor: pointer; background: linear-gradient(90deg, var(--ink) calc(var(--p, 0) * 100%), var(--track) 0); }
      .demo-controls { display: flex; align-items: center; gap: 6px; }
      .demo-spacer { flex: 1; }
      .demo button { font: inherit; color: var(--ink); }
      .demo-icon, .demo-ghost { border: 0; background: transparent; border-radius: 8px; height: 34px; min-width: 34px; padding: 0 10px; font-size: 14px; cursor: pointer; }
      .demo-icon:hover:not(:disabled), .demo-ghost:hover { background: #f3f4f6; }
      .demo-icon:disabled { opacity: 0.3; cursor: default; }
      .demo-play { background: var(--ink); color: #fff !important; }
      .demo-play:hover { background: #374151 !important; }
      .demo button:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
      .demo-list { display: grid; gap: 8px; margin-top: 10px; max-height: min(60vh, 520px); overflow: auto; }
      .demo-option { display: grid; gap: 4px; text-align: left; border: 1px solid var(--track); background: #fff; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
      .demo-option:hover { border-color: #9ca3af; }
      .demo-option .demo-chips { margin: 0 0 2px; }
      .demo-option strong { font-size: 15px; }
      .demo-summary { font-size: 13px; line-height: 1.4; color: var(--muted); }
      .demo-meta { font-size: 12px; color: #6b7280; }
      .demo-launch {
        position: fixed; left: 16px; top: 16px; z-index: 6; font: 600 13px/1 system-ui, sans-serif; color: #111827;
        background: #fff; border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; box-shadow: 0 6px 20px rgba(17, 24, 39, 0.15);
        border-left: 4px solid #ff9933;
      }
      @media (max-width: 700px) { .demo { bottom: 12px; } .demo-title { font-size: 17px; } .demo-text { font-size: 14px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
